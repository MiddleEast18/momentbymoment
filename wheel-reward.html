<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>سحب المكافأة — مِرصاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=202609162318"><link rel="stylesheet" href="logo.css?v=202609100020"><link rel="stylesheet" href="auth.css?v=202609162110">
  <style>
    .wheel-page{min-height:100vh;padding:66px 16px 38px;background:radial-gradient(circle at 50% 18%,rgba(201,162,39,.055),transparent 32%),var(--bg);color:var(--text)}
    .wheel-shell{width:min(610px,100%);margin:auto}.wheel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.wheel-brand{display:flex;align-items:center;gap:8px;color:var(--gold);font:700 19px var(--font-display)}.wheel-brand-mark{width:27px;height:27px;display:grid;place-items:center;border:1px solid rgba(201,162,39,.7);border-radius:50%;font:14px var(--font-mono)}.wheel-back{border:1px solid rgba(201,162,39,.28);border-radius:999px;background:rgba(201,162,39,.04);color:var(--text-dim);padding:8px 13px;font:inherit;cursor:pointer}.wheel-card{position:relative;overflow:hidden;padding:25px 24px 22px;border:1px solid rgba(201,162,39,.25);border-radius:24px;background:linear-gradient(160deg,rgba(24,28,29,.99),rgba(12,15,16,.99));box-shadow:0 24px 70px rgba(0,0,0,.28)}.wheel-card:before{content:'';position:absolute;top:-130px;left:50%;width:280px;height:280px;transform:translateX(-50%);border-radius:50%;background:rgba(201,162,39,.06);filter:blur(28px);pointer-events:none}.wheel-heading{position:relative;text-align:center;margin-bottom:19px}.wheel-kicker{margin:0 0 6px;color:var(--gold);font-size:11px;letter-spacing:.14em}.wheel-card h1{margin:0;font:700 27px var(--font-display)}.wheel-subtitle{margin:7px 0 0;color:var(--text-dim);font-size:12px}.wheel-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:19px}.wheel-stat{padding:10px 6px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.025);color:var(--text-faint);font-size:10px;text-align:center}.wheel-stat strong{display:block;margin-top:4px;color:var(--gold);font:700 16px var(--font-mono)}.wheel-stage{position:relative;display:grid;place-items:center;padding:13px 0 20px}.wheel-pointer{position:absolute;z-index:3;top:0;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid var(--gold);filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}.wheel{width:min(78vw,340px);aspect-ratio:1;border:9px solid #111516;border-radius:50%;background:conic-gradient(#85702c 0deg 22.5deg,#222827 22.5deg 45deg,#a88a35 45deg 67.5deg,#303735 67.5deg 90deg,#79652a 90deg 112.5deg,#202624 112.5deg 135deg,#ad913c 135deg 157.5deg,#2b302e 157.5deg 180deg,#85702c 180deg 202.5deg,#222827 202.5deg 225deg,#a88a35 225deg 247.5deg,#303735 247.5deg 270deg,#79652a 270deg 292.5deg,#202624 292.5deg 315deg,#ad913c 315deg 337.5deg,#2b302e 337.5deg 360deg);box-shadow:0 0 0 1px rgba(201,162,39,.8),0 0 0 7px rgba(201,162,39,.08),0 20px 45px rgba(0,0,0,.42);position:relative;transition:transform 4.2s cubic-bezier(.12,.7,.16,1)}.wheel:before{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,transparent 0deg 21.4deg,rgba(10,13,13,.85) 21.4deg 22.5deg);pointer-events:none}.wheel:after{content:'مِرصاد';position:absolute;inset:35%;display:grid;place-items:center;border-radius:50%;background:#151918;border:2px solid var(--gold);box-shadow:0 0 0 5px rgba(201,162,39,.12),inset 0 0 18px rgba(0,0,0,.55);color:var(--gold);font:700 13px var(--font-display)}.wheel-label{position:absolute;inset:0;display:grid;place-items:center;transform:rotate(var(--angle));pointer-events:none}.wheel-label span{transform:translateY(-120px) rotate(calc(-1 * var(--angle)));color:#f1e6c0;font:700 clamp(9px,2.8vw,13px) var(--font-mono);text-shadow:0 2px 5px rgba(0,0,0,.75)}.wheel-action{width:100%;margin-top:9px;min-height:48px!important;border-radius:13px!important;font-weight:700!important;letter-spacing:.02em}.wheel-status{min-height:22px;margin-top:12px;text-align:center;color:var(--text-dim);font-size:12px}.wheel-status strong{color:var(--gold);font-size:16px}.wheel-bars{display:grid;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07)}.wheel-bar-label{display:flex;justify-content:space-between;color:var(--text-faint);font-size:10px}.wheel-bar-label strong{color:var(--gold);font:600 11px var(--font-mono)}.wheel-bar{height:7px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.08)}.wheel-bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#776126,var(--gold));transition:width .3s ease}@media(max-width:520px){.wheel-page{padding:55px 11px 25px}.wheel-card{padding:22px 14px 18px;border-radius:20px}.wheel-card h1{font-size:24px}.wheel-label span{transform:translateY(-31vw) rotate(calc(-1 * var(--angle)))}}
  </style>
</head>
<body class="mirsad-auth-required"><main id="wheelPage" class="wheel-page" hidden></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-v8.js?v=202609191523"></script><script src="wheel-reward.js?v=202609201545"></script></body>
</html>

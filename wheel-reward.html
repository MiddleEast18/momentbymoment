<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>سحب المكافأة — مِرصاد</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=202609162318"><link rel="stylesheet" href="logo.css?v=202609100020"><link rel="stylesheet" href="auth.css?v=202609162110">
  <style>
    .wheel-page{min-height:100vh;padding:72px 14px 40px;background:var(--bg);color:var(--text)}.wheel-shell{width:min(700px,100%);margin:auto}.wheel-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.wheel-brand{display:flex;align-items:center;gap:9px;color:var(--gold);font:700 20px var(--font-display)}.wheel-back{border:1px solid var(--panel-border-strong);border-radius:999px;background:rgba(255,255,255,.03);color:var(--text-dim);padding:9px 14px;font:inherit;cursor:pointer}.wheel-card{padding:22px;border:1px solid var(--panel-border-strong);border-radius:22px;background:linear-gradient(180deg,rgba(22,29,39,.99),rgba(11,15,20,.99));box-shadow:0 18px 60px rgba(0,0,0,.18)}.wheel-card h1{margin:0 0 6px;font:700 25px var(--font-display)}.wheel-intro{margin:0 0 18px;color:var(--text-dim);font-size:13px}.wheel-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}.wheel-stat{padding:10px;border:1px solid var(--panel-border);border-radius:12px;background:rgba(255,255,255,.03);color:var(--text-dim);font-size:11px;text-align:center}.wheel-stat strong{display:block;margin-top:3px;color:var(--gold);font-size:17px}.wheel-stage{position:relative;display:grid;place-items:center;padding:10px 0 18px}.wheel-pointer{position:absolute;z-index:2;top:0;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:25px solid var(--gold);filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}.wheel{width:min(82vw,360px);aspect-ratio:1;border:10px solid #202a35;border-radius:50%;background:conic-gradient(#7b6bb5 0deg 45deg,#c9a227 45deg 90deg,#4f9dde 90deg 135deg,#b8794a 135deg 180deg,#4fa8a0 180deg 225deg,#8b7bc7 225deg 270deg,#c9a227 270deg 315deg,#4f9dde 315deg 360deg);box-shadow:0 0 0 3px rgba(201,162,39,.32),0 18px 45px rgba(0,0,0,.35);position:relative;transition:transform 4.2s cubic-bezier(.12,.7,.16,1)}.wheel::after{content:'';position:absolute;inset:37%;border-radius:50%;background:var(--bg-elevated);border:2px solid var(--gold);box-shadow:0 0 0 7px rgba(201,162,39,.12)}.wheel-label{position:absolute;inset:0;display:grid;place-items:center;transform:rotate(calc(var(--i)*45deg + 22.5deg));pointer-events:none}.wheel-label span{transform:translateY(-128px) rotate(calc(var(--i)*-45deg - 22.5deg));color:#fff;font:700 clamp(13px,3.5vw,17px) var(--font-mono);text-shadow:0 2px 4px rgba(0,0,0,.45)}.wheel-action{width:100%;margin-top:10px}.wheel-status{min-height:24px;margin-top:12px;text-align:center;color:var(--text-dim)}.wheel-status strong{color:var(--gold)}.wheel-bars{display:grid;gap:10px;margin-top:20px}.wheel-bar-label{display:flex;justify-content:space-between;color:var(--text-dim);font-size:11px}.wheel-bar{height:10px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.08)}.wheel-bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--gold),#f0d47a);transition:width .3s ease}.wheel-note{margin:18px 0 0;padding-top:15px;border-top:1px solid var(--panel-border);color:var(--text-faint);font-size:11px;line-height:1.8}@media(max-width:520px){.wheel-page{padding:58px 11px 28px}.wheel-card{padding:18px 14px;border-radius:18px}.wheel-meta{gap:5px}.wheel-stat{font-size:10px;padding:8px 4px}.wheel-label span{transform:translateY(-30vw) rotate(calc(var(--i)*-45deg - 22.5deg))}}
  </style>
</head>
<body class="mirsad-auth-required"><main id="wheelPage" class="wheel-page" hidden></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-v8.js?v=202609190930"></script><script src="wheel-reward.js?v=202609190930"></script></body>
</html>

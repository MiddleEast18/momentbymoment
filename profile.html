<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملفي الشخصي — مِرصاد</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=202609111655">
  <link rel="stylesheet" href="logo.css?v=202609100020">
  <link rel="stylesheet" href="auth.css?v=202609111110">
  <style>
    .mirsad-profile-page{min-height:100vh;padding:84px 18px 40px;background:var(--bg);color:var(--text)}
    .mirsad-profile-page__shell{width:min(620px,100%);margin:0 auto}
    .mirsad-profile-page__header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
    .mirsad-profile-page__brand{display:flex;align-items:center;gap:10px;color:var(--gold);font-family:var(--font-display);font-size:20px}
    .mirsad-profile-page__brand svg{width:34px;height:34px}
    .mirsad-profile-page__back{border:1px solid var(--panel-border-strong);border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.03);color:var(--text-dim);font:inherit;cursor:pointer}
    .mirsad-profile-page__back:hover{border-color:var(--gold);color:var(--gold)}
    .mirsad-profile-page__card{padding:24px;border:1px solid var(--panel-border-strong);border-radius:22px;background:linear-gradient(180deg,rgba(22,29,39,.99),rgba(11,15,20,.99));box-shadow:0 18px 60px rgba(0,0,0,.18)}
    .mirsad-profile-page__title{margin:0 0 6px;font-family:var(--font-display);font-size:26px}.mirsad-profile-page__intro{margin:0 0 22px;color:var(--text-dim);font-size:13px}
    .mirsad-profile-page__avatar{width:76px;height:76px;margin:0 0 18px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;overflow:hidden;background:rgba(255,255,255,.04);color:var(--gold);font-size:25px;font-weight:700}
    .mirsad-profile-page__avatar img{width:100%;height:100%;object-fit:cover}
    .mirsad-profile-page__actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.mirsad-profile-page__actions button{flex:1;min-width:140px}
    .mirsad-profile-page__danger{margin-top:24px;padding-top:18px;border-top:1px solid var(--panel-border);}.mirsad-profile-page__danger button{color:#fca5a5;border-color:rgba(248,113,113,.35)}
    @media(max-width:520px){.mirsad-profile-page{padding:68px 12px 28px}.mirsad-profile-page__card{padding:20px 16px;border-radius:18px}.mirsad-profile-page__header{align-items:flex-start}.mirsad-profile-page__title{font-size:22px}}
  </style>
</head>
<body class="mirsad-auth-required">
  <main id="mirsadProfilePage" class="mirsad-profile-page" hidden></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-v8.js?v=202609111620"></script>
</body>
</html>

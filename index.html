<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مِرصاد — رصد الشرق الأوسط لحظة بلحظة</title>
  <meta name="description" content="مِرصاد يرصد أخبار الشرق الأوسط لحظة بلحظة: تجميع بالذكاء الاصطناعي، تقييم للثقة، وأخبار بالإنجليزية وبالعربية مع ترجمة.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Kufi+Arabic:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --bg-elevated: #10151c;
      --panel: #161d27;
      --panel-border: rgba(237, 234, 227, 0.08);
      --panel-border-strong: rgba(237, 234, 227, 0.16);
      --text: #ede9e0;
      --text-dim: #9aa4b3;
      --text-faint: #5c6675;
      --gold: #c9a227;
      --gold-soft: rgba(201, 162, 39, 0.16);
      --font-display: 'Noto Kufi Arabic', 'Segoe UI', sans-serif;
      --font-body: 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(ellipse at top left, rgba(201, 162, 39, 0.07), transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.6;
    }
    .gate {
      --parallax-x: 0px;
      --parallax-y: 0px;
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
      align-items: center;
      gap: clamp(20px, 4vw, 64px);
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(28px, 6vh, 72px) clamp(24px, 7vw, 112px);
      overflow: hidden;
      direction: ltr;
      background:
        radial-gradient(ellipse at 18% 52%, rgba(201, 162, 39, 0.055), transparent 42%),
        radial-gradient(ellipse at 92% 14%, rgba(237, 234, 227, 0.025), transparent 38%);
    }
    .map-scene {
      position: relative;
      grid-column: 1;
      grid-row: 1;
      align-self: stretch;
      min-width: 0;
      min-height: min(76vh, 650px);
      pointer-events: none;
    }
    .map-art {
      position: absolute;
      top: 50%;
      left: -13%;
      display: block;
      width: min(79vw, 1120px);
      height: min(88vh, 840px);
      overflow: visible;
      transform: translate3d(var(--parallax-x), calc(-50% + var(--parallax-y)), 0);
      opacity: 0.92;
      mask-image: linear-gradient(90deg, #000 0%, #000 70%, transparent 100%);
    }
    .region-fill { fill: url(#geo-dots); opacity: 0.56; }
    .survey-grid { fill: url(#survey-grid); opacity: 0.22; }
    .land-contour {
      fill: none;
      stroke: rgba(201, 162, 39, 0.15);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
      animation: contour-breathe 34s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .route-line {
      fill: none;
      stroke: rgba(201, 162, 39, 0.3);
      stroke-width: 1.05;
      stroke-dasharray: 2 7;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .route-line--quiet {
      stroke: rgba(237, 234, 227, 0.13);
      stroke-dasharray: 1 9;
    }
    .node { fill: #c9a227; opacity: 0.72; }
    .node-halo { fill: none; stroke: rgba(201, 162, 39, 0.28); stroke-width: 1; }
    .radar-ring {
      fill: none;
      stroke: rgba(201, 162, 39, 0.2);
      stroke-width: 1;
      transform-box: fill-box;
      transform-origin: center;
      animation: radar-breathe 7.5s ease-out infinite;
    }
    .radar-ring--late { animation-delay: -3.75s; }
    .signal-core { fill: #f4d56c; filter: url(#signal-glow); }
    .signal-spark { fill: #fff1b2; opacity: 0.88; }
    .gate-copy {
      position: relative;
      z-index: 1;
      grid-column: 2;
      grid-row: 1;
      justify-self: end;
      width: min(100%, 540px);
      padding: clamp(8px, 2vw, 28px) 0;
      direction: rtl;
      text-align: right;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 clamp(24px, 4vh, 42px);
      color: var(--gold);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0;
    }
    .brand i {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--gold);
      border-radius: 50%;
      font-style: normal;
      font-family: var(--font-mono);
      font-size: 14px;
    }
    h1 {
      margin: 0;
      max-width: 14ch;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.45;
      text-wrap: balance;
    }
    .enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: clamp(28px, 5vh, 48px);
      padding: 0 22px;
      border: 1px solid var(--gold);
      border-radius: 999px;
      background: var(--gold);
      color: #14110a;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
      transition: filter 180ms ease, box-shadow 180ms ease;
    }
    .enter:hover, .enter:active { filter: brightness(1.06); box-shadow: 0 0 28px rgba(201, 162, 39, 0.17); }
    .enter:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    @keyframes radar-breathe {
      0% { opacity: 0.52; transform: scale(0.58); }
      100% { opacity: 0; transform: scale(1.9); }
    }
    @keyframes contour-breathe {
      from { opacity: 0.55; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(3px); }
    }
    @media (max-width: 760px) {
      .gate {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(210px, 1fr);
        align-content: center;
        gap: 0;
        height: 100vh;
        height: 100svh;
        min-height: 100vh;
        min-height: 100svh;
        padding: max(72px, calc(env(safe-area-inset-top) + 48px)) 26px max(28px, env(safe-area-inset-bottom));
      }
      .gate-copy {
        grid-column: 1;
        grid-row: 1;
        justify-self: stretch;
        width: 100%;
        padding: 0;
      }
      .brand { margin-bottom: 18px; font-size: 17px; }
      h1 { max-width: 18ch; font-size: clamp(30px, 8.2vw, 42px); line-height: 1.5; }
      .enter { min-height: 50px; margin-top: 24px; }
      .map-scene {
        grid-column: 1;
        grid-row: 2;
        height: auto;
        min-height: 210px;
        margin: 2px -26px 0;
      }
      .map-art {
        top: 50%;
        left: -4%;
        width: 112%;
        height: 120%;
        mask-image: linear-gradient(180deg, transparent 0%, #000 15%, #000 86%, transparent 100%);
      }
    }
    @media (max-width: 380px) {
      .gate { padding-inline: 20px; }
      .map-scene { margin-inline: -20px; }
      .brand { margin-bottom: 14px; }
      .enter { margin-top: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      .land-contour, .radar-ring { animation: none; }
      .radar-ring { opacity: 0.16; transform: none; }
    }
    html.mirsad-intro-hold { visibility: hidden; }
  </style>
  <script>
    (function () {
      var KEY = 'mirsad.introPassed.v1';
      function markPassed() {
        try { localStorage.setItem(KEY, '1'); } catch (error) {}
      }
      function passed() {
        try {
          if (localStorage.getItem(KEY) === '1' || localStorage.getItem('mirsad.guest.v1') === '1') return true;
          for (var i = 0; i < localStorage.length; i++) {
            var name = localStorage.key(i) || '';
            if (/^sb-.+-auth-token$/.test(name) && /access_token/.test(localStorage.getItem(name) || '')) return true;
          }
        } catch (error) {}
        return false;
      }
      function leave() {
        var search = location.search;
        var hash = location.hash;
        var query = search.slice(1);
        var fragment = hash.slice(1);
        var authQuery = /(^|&)(code|state|error|error_code|error_description)=/.test(query);
        var authHash = /(^|&)(access_token|refresh_token|expires_in|expires_at|token_type|type|error|error_code|error_description|provider_token|provider_refresh_token)=/.test(fragment);
        try {
          var ref = new URLSearchParams(search).get('ref');
          if (ref && /^[A-Za-z0-9_-]{4,64}$/.test(ref.trim())) localStorage.setItem('mirsad.pendingReferral.v1', ref.trim().toUpperCase());
        } catch (error) {}
        if (authQuery || authHash) {
          markPassed();
          document.documentElement.classList.add('mirsad-intro-hold');
          location.replace('live.html' + search + hash);
          return;
        }
      }
      leave();
      window.addEventListener('pageshow', leave);
      document.addEventListener('click', function (event) {
        var link = event.target && event.target.closest ? event.target.closest('a.enter') : null;
        if (link) markPassed();
      });
    })();
  </script>
<link rel="stylesheet" href="reader-settings.css?v=202610050820">

</head>
<body>
  <main class="gate">
    <div class="map-scene" aria-hidden="true">
      <svg class="map-art" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice">
        <defs>
          <pattern id="geo-dots" width="13" height="13" patternUnits="userSpaceOnUse">
            <circle cx="1.5" cy="1.5" r="1" fill="rgba(237,234,227,.32)"/>
          </pattern>
          <pattern id="survey-grid" width="86" height="86" patternUnits="userSpaceOnUse">
            <path d="M86 0H0V86" fill="none" stroke="rgba(237,234,227,.12)" stroke-width=".7"/>
          </pattern>
          <clipPath id="region-mask">
            <path d="M80 136 167 98 243 115 304 83 372 120 435 104 483 152 551 146 603 189 684 174 733 218 822 213 862 270 830 316 858 363 808 402 819 460 766 482 740 545 673 535 626 579 558 557 507 600 444 575 388 601 333 566 269 579 232 532 165 520 141 472 90 451 109 399 74 356 104 306 78 254 118 211Z"/>

        </defs>

        </g>
        <g class="contours">

          <path class="land-contour" d="M79 226C197 155 311 191 384 236S564 269 650 236 792 215 860 274"/>
          <path class="land-contour" d="M71 278C195 212 299 250 375 291S557 323 651 286 789 272 851 321"/>
          <path class="land-contour" d="M90 334C204 277 300 311 378 350S555 379 650 341 780 328 838 371"/>
          <path class="land-contour" d="M110 388C223 341 311 369 390 407S554 433 642 398 768 385 820 425"/>

        </g>
        <g class="stations">
          <circle class="node-halo" cx="154" cy="430" r="7"/><circle class="node" cx="154" cy="430" r="2.3"/>
          <circle class="node-halo" cx="205" cy="190" r="6"/><circle class="node" cx="205" cy="190" r="2"/>
          <circle class="node-halo" cx="331" cy="341" r="10"/><circle class="node" cx="331" cy="341" r="3"/>
          <circle class="node-halo" cx="492" cy="289" r="7"/><circle class="node" cx="492" cy="289" r="2.2"/>
          <circle class="node-halo" cx="599" cy="420" r="6"/><circle class="node" cx="599" cy="420" r="2"/>
          <circle class="node-halo" cx="660" cy="365" r="9"/><circle class="node" cx="660" cy="365" r="2.8"/>
          <circle class="node-halo" cx="824" cy="252" r="6"/><circle class="node" cx="824" cy="252" r="2"/>
          <circle class="radar-ring" cx="331" cy="341" r="15"/><circle class="radar-ring radar-ring--late" cx="660" cy="365" r="15"/>
        </g>
        <g class="signal-runner">
          <circle class="signal-core" cx="0" cy="0" r="4"/>
          <circle class="signal-spark" cx="0" cy="0" r="1.25"/>
          <animateMotion id="signal-motion" begin="indefinite" dur="32s" repeatCount="indefinite" rotate="auto" path="M154 430 C219 389 267 353 331 341 S435 332 492 289 587 246 666 266 762 291 824 252 S738 333 660 365 599 421 480 451 397 438 331 341 242 244 205 190"/>
        </g>
      </svg>
    </div>
    <section class="gate-copy" aria-label="مِرصاد">
      <p class="brand"><i aria-hidden="true">◉</i> مِرصاد</p>
      <h1>رصد الشرق الأوسط لحظة بلحظة</h1>
      <a class="enter" href="live.html">ادخل إلى البث المباشر</a>
    </section>
  </main>
  <script>
    (function () {
      var motion = document.getElementById('signal-motion');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      var root = document.querySelector('.gate');
      function syncMotion() {
        if (reduce.matches && root) {
          root.style.setProperty('--parallax-x', '0px');
          root.style.setProperty('--parallax-y', '0px');
        }
        if (!motion) return;
        try {
          if (reduce.matches) motion.endElement();
          else motion.beginElement();
        } catch (error) {}
      }
      syncMotion();
      if (reduce.addEventListener) reduce.addEventListener('change', syncMotion);
      else if (reduce.addListener) reduce.addListener(syncMotion);
      var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
      if (!root || reduce.matches || !finePointer.matches) return;
      var frame = 0;
      var point = { x: 0, y: 0 };
      root.addEventListener('pointermove', function (event) {
        if (reduce.matches || (event.pointerType && event.pointerType !== 'mouse')) return;
        var bounds = root.getBoundingClientRect();
        point.x = ((event.clientX - bounds.left) / bounds.width - 0.5) * 5;
        point.y = ((event.clientY - bounds.top) / bounds.height - 0.5) * 4;
        if (frame) return;
        frame = window.requestAnimationFrame(function () {
          root.style.setProperty('--parallax-x', point.x.toFixed(1) + 'px');
          root.style.setProperty('--parallax-y', point.y.toFixed(1) + 'px');
          frame = 0;
        });
      }, { passive: true });
      root.addEventListener('pointerleave', function () {
        root.style.setProperty('--parallax-x', '0px');
        root.style.setProperty('--parallax-y', '0px');
      }, { passive: true });
    })();
  </script>

<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مِرصاد — رصد الشرق الأوسط لحظة بلحظة</title>
  <meta name="description" content="مِرصاد يرصد أخبار الشرق الأوسط لحظة بلحظة: تجميع بالذكاء الاصطناعي، تقييم للثقة، وأخبار بالإنجليزية وبالعربية مع ترجمة.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Kufi+Arabic:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --bg-elevated: #10151c;
      --panel: #161d27;
      --panel-border: rgba(237, 234, 227, 0.08);
      --panel-border-strong: rgba(237, 234, 227, 0.16);
      --text: #ede9e0;
      --text-dim: #9aa4b3;
      --text-faint: #5c6675;
      --gold: #c9a227;
      --gold-soft: rgba(201, 162, 39, 0.16);
      --font-display: 'Noto Kufi Arabic', 'Segoe UI', sans-serif;
      --font-body: 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(ellipse at top left, rgba(201, 162, 39, 0.07), transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.6;
    }
    .gate {
      --parallax-x: 0px;
      --parallax-y: 0px;
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
      align-items: center;
      gap: clamp(20px, 4vw, 64px);
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(28px, 6vh, 72px) clamp(24px, 7vw, 112px);
      overflow: hidden;
      direction: ltr;
      background:
        radial-gradient(ellipse at 18% 52%, rgba(201, 162, 39, 0.055), transparent 42%),
        radial-gradient(ellipse at 92% 14%, rgba(237, 234, 227, 0.025), transparent 38%);
    }
    .map-scene {
      position: relative;
      grid-column: 1;
      grid-row: 1;
      align-self: stretch;
      min-width: 0;
      min-height: min(76vh, 650px);
      pointer-events: none;
    }
    .map-art {
      position: absolute;
      top: 50%;
      left: -13%;
      display: block;
      width: min(79vw, 1120px);
      height: min(88vh, 840px);
      overflow: visible;
      transform: translate3d(var(--parallax-x), calc(-50% + var(--parallax-y)), 0);
      opacity: 0.92;
      mask-image: linear-gradient(90deg, #000 0%, #000 70%, transparent 100%);
    }
    .region-fill { fill: url(#geo-dots); opacity: 0.52; }
    .survey-grid { fill: url(#survey-grid); opacity: 0.1; }
    .route-line, .coastline {
      fill: none;
      stroke-dasharray: 3.4 5.2;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .route-line {
      stroke: rgba(201, 162, 39, 0.34);
      stroke-width: 1.05;
    }
    .coastline {
      stroke: rgba(201, 162, 39, 0.7);
      stroke-width: 1.35;
    }
    .node { fill: #c9a227; opacity: 0.72; }
    .node-halo { fill: none; stroke: rgba(201, 162, 39, 0.28); stroke-width: 1; }
    .radar-ring {
      fill: none;
      stroke: rgba(201, 162, 39, 0.2);
      stroke-width: 1;
      transform-box: fill-box;
      transform-origin: center;
      animation: radar-breathe 7.5s ease-out infinite;
    }
    .radar-ring--late { animation-delay: -3.75s; }
    .signal-core { fill: #f4d56c; filter: url(#signal-glow); }
    .signal-spark { fill: #fff1b2; opacity: 0.88; }
    .signal-runner.is-paused .signal-core { animation: signal-blink 0.22s ease-in-out 2; }
    .signal-runner.is-paused .signal-spark { animation: signal-spark-blink 0.22s ease-in-out 2; }
    .gate-copy {
      position: relative;
      z-index: 1;
      grid-column: 2;
      grid-row: 1;
      justify-self: end;
      width: min(100%, 540px);
      padding: clamp(8px, 2vw, 28px) 0;
      direction: rtl;
      text-align: right;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 clamp(24px, 4vh, 42px);
      color: var(--gold);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0;
    }
    .brand i {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--gold);
      border-radius: 50%;
      font-style: normal;
      font-family: var(--font-mono);
      font-size: 14px;
    }
    h1 {
      margin: 0;
      max-width: 14ch;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.45;
      text-wrap: balance;
    }
    .enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: clamp(28px, 5vh, 48px);
      padding: 0 22px;
      border: 1px solid var(--gold);
      border-radius: 999px;
      background: var(--gold);
      color: #14110a;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
      transition: filter 180ms ease, box-shadow 180ms ease;
    }
    .enter:hover, .enter:active { filter: brightness(1.06); box-shadow: 0 0 28px rgba(201, 162, 39, 0.17); }
    .enter:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    @keyframes radar-breathe {
      0% { opacity: 0.52; transform: scale(0.58); }
      100% { opacity: 0; transform: scale(1.9); }
    }
    @keyframes signal-blink { 50% { opacity: 0.18; } }
    @keyframes signal-spark-blink { 50% { opacity: 0.12; } }
    @media (max-width: 760px) {
      .gate {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(210px, 1fr);
        align-content: center;
        gap: 0;
        height: 100vh;
        height: 100svh;
        min-height: 100vh;
        min-height: 100svh;
        padding: max(72px, calc(env(safe-area-inset-top) + 48px)) 26px max(28px, env(safe-area-inset-bottom));
      }
      .gate-copy {
        grid-column: 1;
        grid-row: 1;
        justify-self: stretch;
        width: 100%;
        padding: 0;
      }
      .brand { margin-bottom: 18px; font-size: 17px; }
      h1 { max-width: 18ch; font-size: clamp(30px, 8.2vw, 42px); line-height: 1.5; }
      .enter { min-height: 50px; margin-top: 24px; }
      .map-scene {
        grid-column: 1;
        grid-row: 2;
        height: auto;
        min-height: 210px;
        margin: 2px -26px 0;
      }
      .map-art {
        top: 50%;
        left: -17.5%;
        width: 135%;
        height: auto;
        opacity: 1;
        mask-image: linear-gradient(180deg, transparent 0%, #000 15%, #000 86%, transparent 100%);
      }
      .region-fill { fill: url(#geo-dots-mobile); opacity: 0.68; }
      .coastline { stroke: rgba(201, 162, 39, 0.86); }
    }
    @media (max-width: 380px) {
      .gate { padding-inline: 20px; }
      .map-scene { margin-inline: -20px; }
      .brand { margin-bottom: 14px; }
      .enter { margin-top: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      .radar-ring,
      .signal-runner.is-paused .signal-core, .signal-runner.is-paused .signal-spark { animation: none; }
      .radar-ring { opacity: 0.16; transform: none; }
      .signal-runner.is-paused .signal-core, .signal-runner.is-paused .signal-spark { opacity: 1; }
    }
    html.mirsad-intro-hold { visibility: hidden; }
  </style>

  <script>
    (function () {
      var runner = document.querySelector('.signal-runner');
      var legs = Array.prototype.slice.call(document.querySelectorAll('.signal-leg'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      var root = document.querySelector('.gate');
      var motionFrame = 0;
      var pointerFrame = 0;
      var pauseTimer = 0;
      var activeLeg = 0;
      var lastPoint = null;
      var travelDuration = 28000;
      var pauseDuration = 640;
      var totalLength = legs.reduce(function (sum, leg) { return sum + leg.getTotalLength(); }, 0);

      function setPoint(point) {
        lastPoint = point;
        runner.setAttribute('transform', 'translate(' + point.x.toFixed(2) + ' ' + point.y.toFixed(2) + ')');
      }

      function stopSignal() {
        if (motionFrame) window.cancelAnimationFrame(motionFrame);
        if (pauseTimer) window.clearTimeout(pauseTimer);
        motionFrame = 0;
        pauseTimer = 0;
      }

      function travel(index) {
        if (!runner || !legs.length || reduce.matches) return;
        var legIndex = index % legs.length;
        var leg = legs[legIndex];
        var length = leg.getTotalLength();
        var duration = travelDuration * length / totalLength;
        var startedAt = performance.now();
        activeLeg = legIndex;
        runner.classList.remove('is-paused');

        function advance(now) {
          if (reduce.matches) {
            motionFrame = 0;
            return;
          }
          var progress = Math.min(1, (now - startedAt) / duration);
          setPoint(leg.getPointAtLength(length * progress));
          if (progress < 1) {
            motionFrame = window.requestAnimationFrame(advance);
            return;
          }
          runner.classList.add('is-paused');
          pauseTimer = window.setTimeout(function () {
            pauseTimer = 0;
            if (reduce.matches) return;
            runner.classList.remove('is-paused');
            travel((legIndex + 1) % legs.length);
          }, pauseDuration);
        }

        motionFrame = window.requestAnimationFrame(advance);
      }

      function syncMotion() {
        if (reduce.matches) {
          stopSignal();
          runner.classList.remove('is-paused');
          if (!lastPoint && legs.length) setPoint(legs[0].getPointAtLength(0));
          if (root) {
            root.style.setProperty('--parallax-x', '0px');
            root.style.setProperty('--parallax-y', '0px');
          }
          return;
        }
        if (!motionFrame && !pauseTimer) travel(activeLeg);
      }
      syncMotion();
      if (reduce.addEventListener) reduce.addEventListener('change', syncMotion);
      else if (reduce.addListener) reduce.addListener(syncMotion);
      var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
      if (!root || reduce.matches || !finePointer.matches) return;
      var point = { x: 0, y: 0 };
      root.addEventListener('pointermove', function (event) {
        if (reduce.matches || (event.pointerType && event.pointerType !== 'mouse')) return;
        var bounds = root.getBoundingClientRect();
        point.x = ((event.clientX - bounds.left) / bounds.width - 0.5) * 5;
        point.y = ((event.clientY - bounds.top) / bounds.height - 0.5) * 4;
        if (pointerFrame) return;
        pointerFrame = window.requestAnimationFrame(function () {
          if (reduce.matches) {
            root.style.setProperty('--parallax-x', '0px');
            root.style.setProperty('--parallax-y', '0px');
          } else {
            root.style.setProperty('--parallax-x', point.x.toFixed(1) + 'px');
            root.style.setProperty('--parallax-y', point.y.toFixed(1) + 'px');
          }
          pointerFrame = 0;
        });
      }, { passive: true });
      root.addEventListener('pointerleave', function () {
        root.style.setProperty('--parallax-x', '0px');
        root.style.setProperty('--parallax-y', '0px');
      }, { passive: true });
    })();
  </script>

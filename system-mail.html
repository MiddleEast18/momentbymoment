<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مالك النظام — مِرصاد</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=202610051900">
  <link rel="stylesheet" href="logo.css?v=202609100020">
  <link rel="stylesheet" href="auth.css?v=202610051900">
  <link rel="stylesheet" href="reader-settings.css?v=202610051900">
  <script src="reader-settings.js?v=202610050820"></script>
  <link rel="stylesheet" href="mirsad-nav.css?v=202610050820">
  <script src="mirsad-nav.js?v=202610042205" defer></script>
  <style>
    .system-mail{min-height:100vh;padding:96px 18px 44px;color:var(--text);font-family:var(--font-body)}
    .system-mail__shell{width:min(980px,100%);margin:0 auto}
    .system-mail__head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
    .system-mail__title{margin:0;font:700 clamp(24px,4vw,34px)/1.35 var(--font-display)}
    .system-mail__intro{margin:7px 0 0;color:var(--text-dim);font-size:13px;max-width:62ch;line-height:1.8}
    .system-mail__back{border:1px solid var(--panel-border-strong);border-radius:999px;padding:9px 14px;color:var(--text-dim);text-decoration:none;white-space:nowrap}
    .system-mail__back:hover{border-color:var(--gold);color:var(--gold)}
    .system-mail__status{min-height:22px;margin:10px 0;color:var(--text-dim);font-size:12px}
    .system-mail__list{display:grid;gap:12px}
    .system-message{padding:17px;border:1px solid var(--panel-border-strong);border-radius:16px;background:linear-gradient(180deg,rgba(22,29,39,.98),rgba(11,15,20,.98));box-shadow:0 10px 28px rgba(0,0,0,.12)}
    .system-message.is-unread{border-color:rgba(201,162,39,.65);box-shadow:0 0 0 1px rgba(201,162,39,.12),0 12px 32px rgba(0,0,0,.18)}
    .system-message__dot{display:inline-block;width:8px;height:8px;margin-inline-end:7px;border-radius:50%;background:#e23d3d;box-shadow:0 0 0 3px rgba(226,61,61,.16);vertical-align:middle}
    .inbox-toolbar{display:flex;justify-content:flex-end;margin:0 0 10px}
    .inbox-toolbar button{min-height:36px;border:1px solid var(--panel-border-strong);border-radius:999px;padding:7px 13px;background:rgba(255,255,255,.03);color:var(--gold);font:inherit;cursor:pointer}
    .inbox-toolbar button:hover{border-color:var(--gold)}
    .system-message__meta{display:flex;justify-content:space-between;gap:10px;color:var(--text-faint);font-size:11px}
    .system-message__title{margin:9px 0 6px;font:700 16px/1.6 var(--font-display)}
    .system-message__body{margin:0;color:var(--text-dim);font-size:13px;line-height:1.9;white-space:pre-wrap}
    .system-message__action{margin-top:12px;border:1px solid var(--panel-border-strong);border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.03);color:var(--gold);font:inherit;cursor:pointer}
    .system-message__action:hover{border-color:var(--gold)}
    .developer-panel{display:none;margin-top:8px;padding:20px;border:1px solid rgba(201,162,39,.42);border-radius:18px;background:rgba(201,162,39,.045)}
    .developer-panel.is-visible{display:block}
    .developer-panel h2{margin:0 0 6px;font:700 20px var(--font-display)}
    .developer-panel__intro{margin:0 0 16px;color:var(--text-dim);font-size:12px;line-height:1.8}
    .owner-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 18px}
    .owner-stat{padding:12px;border:1px solid var(--panel-border-strong);border-radius:14px;background:rgba(0,0,0,.18)}
    .owner-stat span{display:block;color:var(--text-faint);font-size:11px}
    .owner-stat strong{display:block;margin-top:4px;color:var(--gold);font:700 22px/1.2 var(--font-display)}
    .developer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .developer-grid label{display:grid;gap:6px;color:var(--text-dim);font-size:12px}
    .developer-grid input,.developer-grid select,.developer-grid textarea{width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid var(--panel-border-strong);border-radius:10px;background:rgba(0,0,0,.15);color:var(--text);font:inherit}
    .developer-grid textarea{min-height:80px;resize:vertical}
    .developer-grid .wide{grid-column:1/-1}
    .developer-actions{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;margin-top:14px}
    .developer-actions button{min-height:48px;border:1px solid var(--gold);border-radius:14px;padding:12px 22px;background:var(--gold-soft);color:var(--gold);font:700 14px var(--font-display);cursor:pointer;white-space:nowrap}
    .developer-actions button:disabled{opacity:.55;cursor:wait}
    .developer-result{flex:1 1 220px;color:var(--text-dim);font-size:12px;line-height:1.7}
    .developer-history{margin-top:20px;border-top:1px solid var(--panel-border);padding-top:16px}
    .developer-history h3{margin:0 0 10px;font-size:14px}
    .reward-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) auto auto;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);color:var(--text-dim);font-size:11px}
    .reward-row strong{color:var(--gold)}
    .accounts-table{display:grid;gap:0;border:1px solid var(--panel-border);border-radius:14px;overflow:hidden}
    .accounts-table__row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 72px;gap:8px;padding:10px 12px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:var(--text-dim)}
    .accounts-table__row:first-child{border-top:0;background:rgba(255,255,255,.03);color:var(--text-faint);font-size:11px}
    .accounts-table__row b{color:var(--text);font-weight:600}
    .empty-state{padding:24px;border:1px dashed var(--panel-border-strong);border-radius:16px;color:var(--text-dim);text-align:center;font-size:13px}
    .inbox-block.is-hidden,.owner-only.is-hidden{display:none}
    @media(max-width:650px){
      .system-mail{padding:88px 12px 30px}
      .system-mail__head{display:block}
      .system-mail__back{display:inline-block;margin-top:13px}
      .developer-grid,.owner-stats,.reward-row,.accounts-table__row{grid-template-columns:1fr}
      .developer-grid .wide{grid-column:auto}
      .developer-actions button{width:100%;white-space:normal}
      .reward-row span:last-child{grid-column:1/-1}
    }
  </style>
</head>
<body class="mirsad-auth-required">
  <main class="system-mail"><div class="system-mail__shell">
    <header class="system-mail__head">
      <div>
        <h1 class="system-mail__title" id="pageTitle">بريد النظام</h1>
        <p class="system-mail__intro" id="pageIntro">الإشعارات الرسمية والمكافآت المرتبطة بحسابك.</p>
      </div>
      <a class="system-mail__back" href="settings.html" id="pageBack">لوحة التحكم</a>
    </header>
    <p id="systemMailStatus" class="system-mail__status" role="status" aria-live="polite">جارٍ التحميل…</p>
    <section id="inboxBlock" class="inbox-block">
      <div id="inboxToolbar" class="inbox-toolbar" hidden>
        <button type="button" id="markAllRead">تحديد الكل كمقروء</button>
      </div>
      <section id="systemMessages" class="system-mail__list" aria-live="polite"></section>
    </section>
    <section id="developerPanel" class="developer-panel" aria-labelledby="developerTitle">
      <h2 id="developerTitle">مالك النظام</h2>
      <p class="developer-panel__intro">حساب المالك لا يستهلك فتحات ولا يستقبل بريد النظام. من هنا تُمنح فتحات القراءة للحسابات العادية فقط، وتُسجَّل العملية مرة واحدة.</p>
      <div id="ownerStats" class="owner-stats" hidden></div>
      <div class="developer-grid">
        <label class="wide">بحث عن حساب<input id="recipientSearch" type="search" placeholder="الاسم أو البريد" autocomplete="off"></label>
        <label>الحساب المستهدف
          <div class="mirsad-select" data-mirsad-select>
            <select id="rewardRecipient" class="mirsad-select__native" tabindex="-1" aria-hidden="true"></select>
            <button class="mirsad-select__trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span data-mirsad-select-label>اختر الحساب</span><span class="mirsad-select__chevron" aria-hidden="true">⌄</span></button>
            <div class="mirsad-select__menu" role="listbox" hidden></div>
          </div>
        </label>
        <label>عدد الفتحات<input id="rewardAmount" type="number" min="1" max="100000" step="1" placeholder="300" inputmode="numeric"></label>
        <label>بداية الفترة<input id="periodStart" type="date"></label>
        <label>نهاية الفترة<input id="periodEnd" type="date"></label>
        <label class="wide">سبب المنح<textarea id="rewardReason" maxlength="1000" placeholder="نشاط أسبوعي مميز"></textarea></label>
      </div>
      <div class="developer-actions">
        <button id="sendReward" type="button">مراجعة وإرسال الفتحات</button>
        <span id="developerResult" class="developer-result" role="status"></span>
      </div>
      <div class="developer-history">
        <h3>الحسابات العادية</h3>
        <div id="accountsTable"></div>
      </div>
      <div class="developer-history">
        <h3>آخر عمليات المنح</h3>
        <div id="rewardHistory"></div>
      </div>
    </section>
  </div></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-v8.js?v=202610051945"></script>
  <script src="system-mail.js?v=202610051945"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بريد النظام — مِرصاد</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=202610031935">
  <link rel="stylesheet" href="logo.css?v=202609100020">
  <link rel="stylesheet" href="auth.css?v=202610020800">
  <link rel="stylesheet" href="reader-settings.css?v=202610030800">
  <script src="reader-settings.js?v=202610030800"></script>
  <link rel="stylesheet" href="mirsad-nav.css?v=202610020800">
  <script src="mirsad-nav.js?v=202610020800" defer></script>
  <style>
    .system-mail{min-height:100vh;padding:84px 18px 44px;color:var(--text)}
    .system-mail__shell{width:min(980px,100%);margin:0 auto}.system-mail__head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.system-mail__title{margin:0;font:700 clamp(24px,4vw,34px)/1.35 var(--font-display)}.system-mail__intro{margin:7px 0 0;color:var(--text-dim);font-size:13px}.system-mail__back{border:1px solid var(--panel-border-strong);border-radius:999px;padding:9px 14px;color:var(--text-dim);text-decoration:none;white-space:nowrap}.system-mail__back:hover{border-color:var(--gold);color:var(--gold)}
    .system-mail__status{min-height:22px;margin:10px 0;color:var(--text-dim);font-size:12px}.system-mail__list{display:grid;gap:12px}.system-message{padding:17px;border:1px solid var(--panel-border-strong);border-radius:16px;background:linear-gradient(180deg,rgba(22,29,39,.98),rgba(11,15,20,.98));box-shadow:0 10px 28px rgba(0,0,0,.12)}.system-message.is-unread{border-color:rgba(201,162,39,.65);box-shadow:0 0 0 1px rgba(201,162,39,.12),0 12px 32px rgba(0,0,0,.18)}.system-message__meta{display:flex;justify-content:space-between;gap:10px;color:var(--text-faint);font-size:11px}.system-message__title{margin:9px 0 6px;font:700 16px/1.6 var(--font-display)}.system-message__body{margin:0;color:var(--text-dim);font-size:13px;line-height:1.9;white-space:pre-wrap}.system-message__action{margin-top:12px;border:1px solid var(--panel-border-strong);border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.03);color:var(--gold);font:inherit;cursor:pointer}.system-message__action:hover{border-color:var(--gold)}
    .developer-panel{display:none;margin-top:28px;padding:20px;border:1px solid rgba(201,162,39,.42);border-radius:18px;background:rgba(201,162,39,.045)}.developer-panel.is-visible{display:block}.developer-panel h2{margin:0 0 6px;font:700 20px var(--font-display)}.developer-panel__intro{margin:0 0 16px;color:var(--text-dim);font-size:12px}.developer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.developer-grid label{display:grid;gap:6px;color:var(--text-dim);font-size:12px}.developer-grid input,.developer-grid select,.developer-grid textarea{width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid var(--panel-border-strong);border-radius:10px;background:rgba(0,0,0,.15);color:var(--text);font:inherit}.developer-grid textarea{min-height:80px;resize:vertical}.developer-grid .wide{grid-column:1/-1}.developer-actions{display:flex;align-items:center;gap:10px;margin-top:14px}.developer-actions button{border:1px solid var(--gold);border-radius:999px;padding:10px 16px;background:var(--gold-soft);color:var(--gold);font:inherit;cursor:pointer}.developer-actions button:disabled{opacity:.55;cursor:wait}.developer-result{color:var(--text-dim);font-size:12px}.developer-history{margin-top:20px;border-top:1px solid var(--panel-border);padding-top:16px}.developer-history h3{margin:0 0 10px;font-size:14px}.reward-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);color:var(--text-dim);font-size:11px}.empty-state{padding:24px;border:1px dashed var(--panel-border-strong);border-radius:16px;color:var(--text-dim);text-align:center;font-size:13px}@media(max-width:650px){.system-mail{padding:68px 12px 30px}.system-mail__head{display:block}.system-mail__back{display:inline-block;margin-top:13px}.developer-grid{grid-template-columns:1fr}.developer-grid .wide{grid-column:auto}.reward-row{grid-template-columns:1fr auto}.reward-row span:last-child{grid-column:1/-1}}
  </style>
</head>
<body class="mirsad-auth-required">
  <main class="system-mail"><div class="system-mail__shell">
    <header class="system-mail__head"><div><h1 class="system-mail__title">بريد النظام</h1><p class="system-mail__intro">الإشعارات الرسمية والمكافآت المرتبطة بحسابك.</p></div><a class="system-mail__back" href="profile.html">العودة للملف الشخصي</a></header>
    <p id="systemMailStatus" class="system-mail__status" role="status" aria-live="polite">جارٍ تحميل الرسائل…</p>
    <section id="systemMessages" class="system-mail__list" aria-live="polite"></section>
    <section id="developerPanel" class="developer-panel" aria-labelledby="developerTitle">
      <h2 id="developerTitle">لوحة المطور</h2><p class="developer-panel__intro">تظهر هذه الأدوات للحسابين المطورين المصرح لهما فقط. إرسال المكافأة عملية مستقلة ومسجلة ولا تتكرر عند إعادة الطلب نفسه.</p>
      <div class="developer-grid"><label>الحساب المستهدف<div class="mirsad-select" data-mirsad-select><select id="rewardRecipient" class="mirsad-select__native" tabindex="-1" aria-hidden="true"></select><button class="mirsad-select__trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span data-mirsad-select-label>اختر الحساب</span><span class="mirsad-select__chevron" aria-hidden="true">⌄</span></button><div class="mirsad-select__menu" role="listbox" hidden></div></div></label><label>نوع المكافأة<div class="mirsad-select" data-mirsad-select><select id="rewardType" class="mirsad-select__native" tabindex="-1" aria-hidden="true"><option value="unlock">فتحات قراءة</option><option value="points">نقاط</option><option value="premium_days">أيام مميزة</option></select><button class="mirsad-select__trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span data-mirsad-select-label>فتحات قراءة</span><span class="mirsad-select__chevron" aria-hidden="true">⌄</span></button><div class="mirsad-select__menu" role="listbox" hidden></div></div></label><label>القيمة<input id="rewardAmount" type="number" min="1" max="100000" step="1" placeholder="57"></label><label>بداية الفترة<input id="periodStart" type="date"></label><label>نهاية الفترة<input id="periodEnd" type="date"></label><label class="wide">سبب المكافأة<textarea id="rewardReason" maxlength="1000" placeholder="نشاط أسبوعي مميز"></textarea></label></div>
      <div class="developer-actions"><button id="sendReward" type="button">مراجعة وإرسال المكافأة</button><span id="developerResult" class="developer-result" role="status"></span></div>
      <div class="developer-history"><h3>آخر عمليات المكافآت</h3><div id="rewardHistory"></div></div>
    </section>
  </div></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-v8.js?v=202610030900"></script>
  <script src="system-mail.js?v=202610031935"></script>
</body>
</html>

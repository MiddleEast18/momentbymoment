<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المكافأة اليومية — مِرصاد</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=202609162318">
  <link rel="stylesheet" href="logo.css?v=202609100020">
  <link rel="stylesheet" href="auth.css?v=202609162110">
  <style>
    .mirsad-reward-page{min-height:100vh;padding:84px 18px 40px;background:var(--bg);color:var(--text)}
    .mirsad-reward-page__shell{width:min(620px,100%);margin:0 auto}.mirsad-reward-page__header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
    .mirsad-reward-page__brand{display:flex;align-items:center;gap:10px;color:var(--gold);font-family:var(--font-display);font-size:20px}.mirsad-reward-page__back{border:1px solid var(--panel-border-strong);border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.03);color:var(--text-dim);font:inherit;cursor:pointer}.mirsad-reward-page__back:hover{border-color:var(--gold);color:var(--gold)}
    .mirsad-reward-card{padding:24px;border:1px solid var(--panel-border-strong);border-radius:22px;background:linear-gradient(180deg,rgba(22,29,39,.99),rgba(11,15,20,.99));box-shadow:0 18px 60px rgba(0,0,0,.18)}
    .mirsad-reward-card h1{margin:0 0 6px;font-family:var(--font-display);font-size:26px}.mirsad-reward-intro{margin:0 0 22px;color:var(--text-dim);font-size:13px}.mirsad-reward-hero{display:grid;gap:8px;padding:22px;text-align:center;border:1px solid rgba(201,162,39,.45);border-radius:18px;background:linear-gradient(135deg,rgba(201,162,39,.14),rgba(255,255,255,.035))}.mirsad-reward-amount{font:700 38px var(--font-display);color:var(--gold)}.mirsad-reward-hero small{color:var(--text-dim)}.mirsad-reward-balance{display:flex;justify-content:space-between;gap:12px;margin:16px 0;padding:14px;border-radius:12px;background:rgba(255,255,255,.04);color:var(--text-dim)}.mirsad-reward-balance strong{color:var(--text)}.mirsad-reward-action{width:100%;margin-top:2px}.mirsad-reward-status{min-height:22px;margin-top:12px;text-align:center}.mirsad-reward-streak{margin-top:22px;padding-top:18px;border-top:1px solid var(--panel-border)}.mirsad-reward-streak h2,.mirsad-reward-history h2{margin:0 0 12px;font-size:16px}.mirsad-reward-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.mirsad-reward-day{padding:9px 4px;border:1px solid var(--panel-border);border-radius:10px;text-align:center;color:var(--text-dim);font-size:11px}.mirsad-reward-day strong{display:block;color:var(--gold);font-size:14px;margin-bottom:3px}.mirsad-reward-history{margin-top:22px;padding-top:18px;border-top:1px solid var(--panel-border)}.mirsad-reward-history ul{display:grid;gap:7px;margin:0;padding:0;list-style:none;color:var(--text-dim);font-size:12px}.mirsad-reward-history li{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.03)}.mirsad-reward-history li strong{color:var(--gold)}
    @media(max-width:520px){.mirsad-reward-page{padding:68px 12px 28px}.mirsad-reward-card{padding:20px 16px;border-radius:18px}.mirsad-reward-card h1{font-size:22px}.mirsad-reward-days{gap:4px}.mirsad-reward-day{font-size:10px;padding:8px 2px}}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="mirsad-locale.js?v=202609191651"></script>
  <script src="mirsad-i18n.js?v=202609191700"></script>
</head>
<body class="mirsad-auth-required">
  <main id="mirsadRewardPage" class="mirsad-reward-page" hidden></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-v8.js?v=202609191523"></script>
  <script src="daily-reward.js?v=202609142140"></script>
  <script src="pull-refresh.js?v=202609162320"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>استرداد الاستهلاك — مِرصاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=202609162318"><link rel="stylesheet" href="logo.css?v=202609100020"><link rel="stylesheet" href="auth.css?v=202609162110">
  <style>
    .recovery-page{min-height:100vh;padding:66px 16px 38px;background:radial-gradient(circle at 50% 12%,rgba(201,162,39,.06),transparent 34%),var(--bg);color:var(--text)}.recovery-shell{width:min(610px,100%);margin:auto}.recovery-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.recovery-brand{display:flex;align-items:center;gap:8px;color:var(--gold);font:700 19px var(--font-display)}.recovery-mark{width:27px;height:27px;display:grid;place-items:center;border:1px solid rgba(201,162,39,.7);border-radius:50%;font:14px var(--font-mono)}.recovery-back{border:1px solid rgba(201,162,39,.28);border-radius:999px;background:rgba(201,162,39,.04);color:var(--text-dim);padding:8px 13px;font:inherit;cursor:pointer}.recovery-card{padding:27px 24px 24px;border:1px solid rgba(201,162,39,.25);border-radius:24px;background:linear-gradient(160deg,rgba(24,28,29,.99),rgba(12,15,16,.99));box-shadow:0 24px 70px rgba(0,0,0,.28)}.recovery-heading{text-align:center}.recovery-kicker{margin:0 0 7px;color:var(--gold);font-size:11px;letter-spacing:.14em}.recovery-card h1{margin:0;font:700 27px var(--font-display)}.recovery-subtitle{margin:8px 0 25px;color:var(--text-dim);font-size:13px}.recovery-value{text-align:center;margin:4px 0 18px}.recovery-value strong{display:block;color:var(--gold);font:700 clamp(32px,9vw,52px) var(--font-mono)}.recovery-value span{color:var(--text-faint);font-size:11px}.recovery-track{height:14px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}.recovery-track i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#776126,var(--gold));transition:width .5s ease}.recovery-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:13px}.recovery-stat{padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.025);text-align:center;color:var(--text-faint);font-size:11px}.recovery-stat strong{display:block;margin-top:4px;color:var(--text);font:600 15px var(--font-mono)}.recovery-offer{margin-top:22px;padding:17px;border:1px solid rgba(201,162,39,.28);border-radius:16px;background:rgba(201,162,39,.055);text-align:center}.recovery-offer h2{margin:0;color:var(--gold);font:700 18px var(--font-display)}.recovery-offer p{margin:7px 0 15px;color:var(--text-dim);font-size:12px;line-height:1.8}.recovery-price{display:block;margin-bottom:12px;color:var(--text);font:700 22px var(--font-mono)}.recovery-action{width:100%;min-height:46px;border-radius:12px!important}.recovery-note{margin:16px 0 0;color:var(--text-faint);font-size:10px;line-height:1.8;text-align:center}@media(max-width:520px){.recovery-page{padding:55px 11px 25px}.recovery-card{padding:23px 15px 19px;border-radius:20px}.recovery-card h1{font-size:24px}}
  </style>
  <script src="mirsad-locale.js?v=202609191651"></script>
  <script src="mirsad-i18n.js?v=202609191704"></script>
</head>
<body class="mirsad-auth-required"><main id="recoveryPage" class="recovery-page" hidden></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-v8.js?v=202609191523"></script><script src="consumption-recovery.js?v=202609191522"></script></body>
</html>
